name: Supabase Keepalive

on:
  schedule:
    - cron: '0 1 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL="https://qctkhonnwrbxjuccqqly.supabase.co/rest/v1/messages?select=id&limit=1"
          KEY="sb_publishable_xWjKIiiUj4M8AAj8lAxYdQ_aVDulEj3"
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase keepalive failed, HTTP $code - please Restore in dashboard"
            exit 1
          fi
          echo "keepalive ok"

      - name: Keep repo active
        run: |
          echo "last-run=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "nothing"
          git push
